{% extends "base.html" %}

{% block title %}Page Not Found - ASD{% endblock %}

{% block content %}
<div class="page-container fade-in">
    <div class="error-page">
        <div class="error-content">
            <img src="https://img.icons8.com/fluency/128/nothing-found.png" alt="404" class="error-icon">
            <h1 class="error-title">404</h1>
            <h2 class="error-subtitle">Page Not Found</h2>
            <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
            <div class="error-actions">
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                    <img src="https://img.icons8.com/fluency/20/home.png" alt="home">
                    Go to Dashboard
                </a>
                <button class="btn btn-outline" onclick="history.back()">
                    <img src="https://img.icons8.com/fluency/20/left.png" alt="back">
                    Go Back
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
